  <meta name="description" content="原生 JavaScript 实现的任务清单：添加、勾选、筛选、删除，数据保存在浏览器本地。">
  <meta name="theme-color" content="#f7f8f6">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">ZM</span>
        <span class="brand-name">张明</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">作品集</a>
        <a href="index.html#skills">技能</a>
        <a class="nav-gh" href="https://github.com/your-username" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <main class="demo-main" id="main">
    <div class="wrap demo-wrap">
      <p class="eyebrow">在线 Demo · 原生 JavaScript</p>
      <h1>任务清单</h1>
      <p class="demo-sub">数据保存在这个浏览器里，不会上传到服务器。刷新页面后任务还在。</p>

      <section class="task-app" aria-label="任务清单应用">
        <form class="task-form" id="taskForm" autocomplete="off">
          <label class="sr-only" for="taskInput">新任务内容</label>
          <input id="taskInput" name="task" type="text" maxlength="120" placeholder="要做什么？按回车添加" required>
          <button class="btn btn-primary" type="submit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            添加
          </button>
        </form>

        <div class="task-toolbar">
          <div class="seg" role="group" aria-label="筛选任务">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="active" aria-pressed="false">进行中</button>
            <button type="button" data-filter="done" aria-pressed="false">已完成</button>
          </div>
          <p class="task-count" id="taskCount" role="status" aria-live="polite">0 项</p>
        </div>

        <ul class="task-list" id="taskList"></ul>
        <p class="task-empty" id="taskEmpty" hidden>还没有任务，添加第一条吧。</p>

        <div class="task-foot">
          <span id="taskSummary">共 0 项</span>
          <button type="button" class="link-btn" id="clearDone" disabled>清除已完成</button>
        </div>
      </section>

      <p class="demo-note">技术点：DOM 事件委托、localStorage 持久化、用 textContent 渲染避免 XSS、键盘与读屏软件可用的标记。</p>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        返回作品集
      </a>
    </div>
  </main>

  <footer class="site-footer">
